[package]
name = "projstat"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "projstat"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
